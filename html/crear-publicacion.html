<!DOCTYPE html>
<html>
    <meta charset="UTF-8">
    <head>Crear publicación | Side B</head>

    <body>
        <section id="crear-publicacion">
            <h2>
                Crear publicación
            </h2>

            <form method="post">
                <label for="contenido">¿Qué estás escuchando?</label>
                <textarea id="contenido" name="contenido" placeholder="Este albúm nuevo me encantó"></textarea>
                <label for="categoria">Selecciona una categoría:</label>
                <select id="categoria" name="categoria">
                    <option value="reseña">Reseña de albúm</option>
                    <option value="reseña">Reseña de canción</option>
                    <option value="discusion">Discusión</option>
                    <option value="recomendacion">Recomendación musical</option>
                    <option value="polemica">Polémica</option>
                    <option value="descubirmiento">Descubrimiento</option>
                </select>
                <button type="submit">Publicar</button>
            </form>
        </section>
    </body>
</html>
